spring.application.name=incident-service
spring.threads.virtual.enabled=true
server.port=8084

incident.prometheus-url=${PROMETHEUS_URL:http://localhost:9090}
incident.loki-url=${LOKI_URL:http://localhost:3100}
incident.tempo-url=${TEMPO_URL:http://localhost:3200}
incident.grafana-url=${GRAFANA_URL:http://localhost:3000}
incident.investigation-topic=${INVESTIGATION_TOPIC:incident-investigation}
incident.notification-topic=${NOTIFICATION_TOPIC:incident-notification}
incident.ai-enabled=${AI_INVESTIGATION_ENABLED:false}
incident.ai-investigation-topic=${AI_INVESTIGATION_TOPIC:incident-ai-analysis}
incident.maximum-log-lines=${INCIDENT_MAXIMUM_LOG_LINES:10}
incident.maximum-page-size=${INCIDENT_MAXIMUM_PAGE_SIZE:100}
incident.resolved-retention-days=${INCIDENT_RESOLVED_RETENTION_DAYS:30}
incident.outbox-retention-days=${INCIDENT_OUTBOX_RETENTION_DAYS:7}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.microobserve.incident.model.InvestigationRequested
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microobserve.incident.model,com.microobserve.incident.api

spring.datasource.url=${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/incident_platform}
spring.datasource.username=${INCIDENT_DB_USERNAME:observe}
spring.datasource.password=${INCIDENT_DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
server.error.include-message=never
server.error.include-stacktrace=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=incident-service
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.loki.url=${LOGGING_LOKI_URL:http://localhost:3100/loki/api/v1/push}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n

springdoc.swagger-ui.path=/swagger-ui.html
