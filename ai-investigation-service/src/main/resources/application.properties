spring.application.name=ai-investigation-service
spring.threads.virtual.enabled=true
server.port=8085

ai.enabled=${AI_ENABLED:false}
ai.api-key=${GEMINI_API_KEY:}
ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.generation-model=${GEMINI_GENERATION_MODEL:gemini-3.5-flash}
ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
ai.retrieval-top-k=${AI_RETRIEVAL_TOP_K:5}
ai.investigation-topic=${AI_INVESTIGATION_TOPIC:incident-ai-analysis}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.microobserve.ai.model.AiInvestigationRequested
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microobserve.ai.model
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.datasource.url=${AI_DB_URL:jdbc:postgresql://localhost:5432/ai_investigation}
spring.datasource.username=${AI_DB_USERNAME:observe}
spring.datasource.password=${AI_DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.observations.key-values.application=ai-investigation-service
server.error.include-message=never
server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html
