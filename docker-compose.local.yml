services:
  postgres:
    mem_limit: 256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB

  broker:
    mem_limit: 512m
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 67108864

  inventory-service:
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

  order-service:
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

  incident-service:
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

  notification-service:
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

  api-gateway:
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=65 -XX:+UseSerialGC

  prometheus:
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 220MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB

  alertmanager:
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB

  loki:
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 220MiB

  tempo:
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 220MiB

  grafana:
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 220MiB

  kafka-ui:
    mem_limit: 256m
    environment:
      JAVA_OPTS: -Xms64m -Xmx192m
