spring.application.name=notification-service
spring.threads.virtual.enabled=true
server.port=8083

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
notification.mail.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
notification.mail.from=${NOTIFICATION_FROM:${SMTP_USERNAME:}}
notification.mail.recipient=${ALERT_EMAIL_TO:${SMTP_USERNAME:}}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.micro_service.notification_service.api.IncidentEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.micro_service.notification_service.api
incident.topic=${NOTIFICATION_TOPIC:incident-notification}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=notification-service

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n
logging.level.root=INFO

# Bound SMTP failures; the live switch is checked for each consumed event.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
