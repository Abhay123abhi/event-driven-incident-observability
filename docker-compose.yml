name: micro-observe-kafka

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-observability}
  MANAGEMENT_TRACING_ENABLED: ${TRACING_ENABLED:-true}
  ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
  LOGGING_LOKI_URL: http://loki:3100/loki/api/v1/push

x-java-service: &java-service
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [backend]

x-java-healthcheck: &java-healthcheck
  interval: 15s
  timeout: 10s
  retries: 12
  start_period: 120s

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: observe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observe -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  broker:
    image: confluentinc/cp-kafka:7.9.9
    restart: unless-stopped
    expose: ["29092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server broker:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  inventory-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: inventory-service }
    mem_limit: 384m
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8082:8082"]
    environment:
      <<: *java-environment
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_service
      INVENTORY_DB_USERNAME: observe
      INVENTORY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]

  order-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: order-service }
    mem_limit: 384m
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8081:8081"]
    environment:
      <<: *java-environment
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_service
      ORDER_DB_USERNAME: observe
      ORDER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]

  incident-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: incident-service }
    mem_limit: 448m
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8084:8084"]
    environment:
      <<: *java-environment
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      INCIDENT_DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      INCIDENT_DB_USERNAME: observe
      INCIDENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      INCIDENT_MAXIMUM_PAGE_SIZE: ${INCIDENT_MAXIMUM_PAGE_SIZE:-100}
      INCIDENT_RESOLVED_RETENTION_DAYS: ${INCIDENT_RESOLVED_RETENTION_DAYS:-30}
      INCIDENT_OUTBOX_RETENTION_DAYS: ${INCIDENT_OUTBOX_RETENTION_DAYS:-7}
      GRAFANA_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      broker: { condition: service_healthy }
      prometheus: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]

  notification-service:
    <<: *java-service
    profiles: [email]
    build:
      context: .
      args: { SERVICE: notification-service }
    mem_limit: 384m
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8083:8083"]
    environment:
      <<: *java-environment
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      broker: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]

  api-gateway:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: api-gateway }
    mem_limit: 384m
    ports: ["${BIND_ADDRESS:-127.0.0.1}:9000:9000"]
    environment:
      <<: *java-environment
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      INCIDENT_SERVICE_URL: http://incident-service:8084
    depends_on:
      order-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      incident-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/actuator/health"]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:9090:9090"]
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:9093:9093"]
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [backend]

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:3100:3100"]
    volumes: [loki-data:/loki]
    networks: [backend]

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:3200:3200", "${BIND_ADDRESS:-127.0.0.1}:9411:9411"]
    volumes:
      - ./ops/observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks: [backend]

  grafana:
    image: grafana/grafana:12.4.10
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./ops/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./ops/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    profiles: [tools]
    depends_on:
      broker: { condition: service_healthy }
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8086:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: incidents
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:
