name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify reactor
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Docker Compose configuration
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export SMTP_USERNAME="ci@example.invalid"
          export SMTP_PASSWORD="$(openssl rand -hex 24)"
          export NOTIFICATION_FROM="ci@example.invalid"
          export ALERT_EMAIL_TO="operations@example.invalid"
          export AI_INVESTIGATION_ENABLED=true
          export GEMINI_API_KEY="ci-placeholder"
          docker compose --profile tools --profile email --profile ai config --quiet
          docker compose --profile tools --profile email --profile ai config --format json | python -c 'import json, sys; services = json.load(sys.stdin)["services"]; names = ("inventory-service", "order-service", "incident-service", "notification-service", "ai-investigation-service", "api-gateway"); required = ("interval", "timeout", "retries", "start_period"); missing = {name: [key for key in required if key not in services[name]["healthcheck"]] for name in names}; assert not any(missing.values()), f"Missing Java health-check settings: {missing}"'

      - name: Build incident application container
        run: docker build --build-arg SERVICE=incident-service --tag observe-incident:ci .

      - name: Build AI investigation container
        run: docker build --build-arg SERVICE=ai-investigation-service --tag observe-ai-investigation:ci .

  incident-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/desk-browser playwright@1.51.1
          /tmp/desk-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check UI in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/desk-browser/node_modules/playwright
        run: |
          node --check api-gateway/src/main/resources/static/desk.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory api-gateway/src/main/resources/static > /tmp/desk-server.log 2>&1 &
          desk_server_pid=$!
          trap 'kill "$desk_server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ui-check.cjs
      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incident-ui-previews
          path: /tmp/incident-*.png
