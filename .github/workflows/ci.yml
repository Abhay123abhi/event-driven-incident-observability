name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify reactor
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Docker Compose configuration
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export SMTP_USERNAME="ci@example.invalid"
          export SMTP_PASSWORD="$(openssl rand -hex 24)"
          export NOTIFICATION_FROM="ci@example.invalid"
          export ALERT_EMAIL_TO="operations@example.invalid"
          docker compose --profile tools --profile email config --quiet
          docker compose --profile tools --profile email config --format json | python -c 'import json, sys; services = json.load(sys.stdin)["services"]; names = ("inventory-service", "order-service", "incident-service", "notification-service", "api-gateway"); required = ("interval", "timeout", "retries", "start_period"); missing = {name: [key for key in required if key not in services[name]["healthcheck"]] for name in names}; assert not any(missing.values()), f"Missing Java health-check settings: {missing}"'

      - name: Build application container
        run: docker build --build-arg SERVICE=incident-service --tag observe-incident:ci .

  incident-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/desk-browser playwright@1.51.1
          /tmp/desk-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check UI in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/desk-browser/node_modules/playwright
        run: |
          node --check api-gateway/src/main/resources/static/desk.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory api-gateway/src/main/resources/static > /tmp/desk-server.log 2>&1 &
          desk_server_pid=$!
          trap 'kill "$desk_server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ui-check.cjs
      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-ui-previews
          path: /tmp/incident-*.png

  render-static-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render existing Mermaid sources
        run: |
          npm install --prefix /tmp/diagram-tools @mermaid-js/mermaid-cli@11.4.2
          python3 - <<'PY'
          import re, pathlib, json
          diagrams = re.findall(r'```mermaid\n(.*?)```', pathlib.Path('README.md').read_text(), re.S)
          assert len(diagrams) == 2
          for i, diagram in enumerate(diagrams):
              pathlib.Path(f'/tmp/architecture-{i}.mmd').write_text(diagram)
          pathlib.Path('/tmp/puppeteer.json').write_text(json.dumps({'args':['--no-sandbox']}))
          PY
          for number in 0 1; do
            /tmp/diagram-tools/node_modules/.bin/mmdc -i /tmp/architecture-$number.mmd -o /tmp/architecture-$number.svg -p /tmp/puppeteer.json -b transparent -t default
          done
          python3 - <<'PY'
          import pathlib, base64
          for i in range(2):
              svg = pathlib.Path(f'/tmp/architecture-{i}.svg').read_bytes()
              print(f'STATIC_SVG_{i}_BEGIN' + base64.b64encode(svg).decode() + f'STATIC_SVG_{i}_END')
          PY
