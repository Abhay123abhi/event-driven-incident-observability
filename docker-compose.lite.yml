# Local low-memory mode: keep metrics, alerts, Kafka, PostgreSQL and the Incident Desk.
# Skip Loki, Tempo and Grafana. Missing logs/traces are explicitly marked unavailable
# in investigation reports; use the normal compose file for complete observability.
#
# docker compose -f docker-compose.yml -f docker-compose.lite.yml up --build -d
services:
  loki:
    profiles: [full]
  tempo-init:
    profiles: [full]
  tempo:
    profiles: [full]
  grafana:
    profiles: [full]

  inventory-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
  order-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
  incident-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
  ai-investigation-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES_ACTIVE:-local}
      MANAGEMENT_TRACING_ENABLED: "false"
